<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Call</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    color: #eeeeee;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-weight: normal;
    font-size: 20px;
    margin: 10px 0 20px 0;
  }
  #status {
    color: #aaaaaa;
    margin-bottom: 20px;
    min-height: 20px;
    font-size: 14px;
  }
  button {
    padding: 12px 22px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
    color: #ffffff;
    background: #3498db;
  }
  button.secondary { background: #555555; }
  button.danger { background: #e74c3c; }
  button:disabled { background: #333333; color: #777777; cursor: default; }
  textarea {
    width: 100%;
    max-width: 400px;
    height: 90px;
    background: #1a1a1a;
    color: #eeeeee;
    border: 1px solid #444444;
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    margin: 10px 0;
    resize: none;
  }
  .step {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    width: 100%;
    max-width: 400px;
    display: none;
  }
  .step.visible { display: block; }
  .step p { margin: 0 0 8px 0; font-size: 13px; color: #999999; }
  #muteBtn.muted { background: #e67e22; }
  #callControls { display: none; margin-top: 10px; }
</style>
</head>
<body>

<h1>Voice Call</h1>
<div id="status">Choose an option below</div>

<div id="chooseSection">
  <button id="startCallBtn">Start a New Call</button>
  <button id="joinCallBtn" class="secondary">Join a Call</button>
</div>

<div id="step1" class="step">
  <p>1. Copy this code and send it to your friend:</p>
  <textarea id="offerCode" readonly></textarea>
  <button id="copyOfferBtn">Copy Code</button>
</div>

<div id="step2" class="step">
  <p>2. Paste the code your friend sends back here:</p>
  <textarea id="answerInput" placeholder="Paste their reply code here"></textarea>
  <button id="connectBtn">Connect</button>
</div>

<div id="joinStep1" class="step">
  <p>1. Paste the code your friend sent you:</p>
  <textarea id="offerInput" placeholder="Paste their code here"></textarea>
  <button id="generateAnswerBtn">Generate Reply Code</button>
</div>

<div id="joinStep2" class="step">
  <p>2. Copy this reply code and send it back to your friend:</p>
  <textarea id="answerCode" readonly></textarea>
  <button id="copyAnswerBtn">Copy Reply Code</button>
</div>

<div id="callControls">
  <button id="hangupBtn" class="danger">Hang Up</button>
  <button id="muteBtn" class="secondary">Mute</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
const statusEl = document.getElementById('status');
const chooseSection = document.getElementById('chooseSection');
const startCallBtn = document.getElementById('startCallBtn');
const joinCallBtn = document.getElementById('joinCallBtn');

const step1 = document.getElementById('step1');
const offerCode = document.getElementById('offerCode');
const copyOfferBtn = document.getElementById('copyOfferBtn');

const step2 = document.getElementById('step2');
const answerInput = document.getElementById('answerInput');
const connectBtn = document.getElementById('connectBtn');

const joinStep1 = document.getElementById('joinStep1');
const offerInput = document.getElementById('offerInput');
const generateAnswerBtn = document.getElementById('generateAnswerBtn');

const joinStep2 = document.getElementById('joinStep2');
const answerCode = document.getElementById('answerCode');
const copyAnswerBtn = document.getElementById('copyAnswerBtn');

const callControls = document.getElementById('callControls');
const hangupBtn = document.getElementById('hangupBtn');
const muteBtn = document.getElementById('muteBtn');
const remoteAudio = document.getElementById('remoteAudio');

let pc;
let localStream;
let muted = false;

const rtcConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};

function encode(obj) {
  return btoa(JSON.stringify(obj));
}
function decode(str) {
  return JSON.parse(atob(str.trim()));
}

async function getMic() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    return true;
  } catch (e) {
    statusEl.textContent = "Mic permission denied.";
    return false;
  }
}

function createPeerConnection() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.ontrack = (e) => {
    remoteAudio.srcObject = e.streams[0];
    statusEl.textContent = "Connected — you're live!";
    callControls.style.display = 'block';
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      statusEl.textContent = "Call disconnected.";
    }
  };

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

function waitForIceGathering() {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') {
      resolve();
    } else {
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') resolve();
      });
    }
  });
}

startCallBtn.addEventListener('click', async () => {
  statusEl.textContent = "Requesting mic...";
  if (!(await getMic())) return;
  chooseSection.style.display = 'none';
  statusEl.textContent = "Creating call code...";

  createPeerConnection();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIceGathering();

  offerCode.value = encode(pc.localDescription);
  step1.classList.add('visible');
  step2.classList.add('visible');
  statusEl.textContent = "Send the code below to your friend.";
});

copyOfferBtn.addEventListener('click', () => {
  offerCode.select();
  document.execCommand('copy');
  copyOfferBtn.textContent = "Copied!";
  setTimeout(() => copyOfferBtn.textContent = "Copy Code", 1500);
});

connectBtn.addEventListener('click', async () => {
  try {
    const answer = decode(answerInput.value);
    await pc.setRemoteDescription(answer);
    statusEl.textContent = "Connecting...";
  } catch (e) {
    statusEl.textContent = "Invalid code. Ask your friend to resend it.";
  }
});

joinCallBtn.addEventListener('click', async () => {
  statusEl.textContent = "Requesting mic...";
  if (!(await getMic())) return;
  chooseSection.style.display = 'none';
  joinStep1.classList.add('visible');
  statusEl.textContent = "Paste the code your friend sent you.";
});

generateAnswerBtn.addEventListener('click', async () => {
  try {
    const offer = decode(offerInput.value);
    createPeerConnection();
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForIceGathering();

    answerCode.value = encode(pc.localDescription);
    joinStep2.classList.add('visible');
    statusEl.textContent = "Send this reply code back to your friend.";
  } catch (e) {
    statusEl.textContent = "Invalid code. Ask your friend to resend it.";
  }
});

copyAnswerBtn.addEventListener('click', () => {
  answerCode.select();
  document.execCommand('copy');
  copyAnswerBtn.textContent = "Copied!";
  setTimeout(() => copyAnswerBtn.textContent = "Copy Reply Code", 1500);
});

hangupBtn.addEventListener('click', () => {
  if (pc) pc.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  location.reload();
});

muteBtn.addEventListener('click', () => {
  if (!localStream) return;
  muted = !muted;
  localStream.getAudioTracks().forEach(track => track.enabled = !muted);
  muteBtn.classList.toggle('muted', muted);
  muteBtn.textContent = muted ? "Unmute" : "Mute";
});
</script>

</body>
</html>
