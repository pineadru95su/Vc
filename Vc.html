<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Call</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    color: #eeeeee;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-weight: normal;
    font-size: 20px;
    margin: 0 0 20px 0;
  }
  #status {
    color: #aaaaaa;
    margin-bottom: 20px;
    min-height: 20px;
    font-size: 14px;
  }
  input {
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #444444;
    background: #1a1a1a;
    color: #eeeeee;
    width: 200px;
    text-align: center;
    margin-bottom: 15px;
  }
  button {
    padding: 12px 22px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
    color: #ffffff;
  }
  #enterBtn { background: #3498db; }
  #hangupBtn { background: #e74c3c; }
  #muteBtn { background: #333333; border: 1px solid #555555; color: #eeeeee; }
  #muteBtn.muted { background: #e67e22; }
  #callControls { margin-top: 20px; }
</style>
</head>
<body>

<h1>Voice Call</h1>
<div id="status">Enter password to join</div>

<div id="passSection">
  <input id="passInput" type="password" placeholder="Password" autocomplete="off">
  <br>
  <button id="enterBtn">Enter</button>
</div>

<div id="callControls" style="display:none;">
  <button id="hangupBtn">Hang Up</button>
  <button id="muteBtn">Mute</button>
</div>

<button id="retryBtn" style="display:none;background:#f39c12;">Retry Connection</button>

<div id="diag" style="font-size:14px;color:#2ecc71;margin-top:15px;max-width:340px;border:1px solid #333333;border-radius:8px;padding:10px;text-align:left;white-space:pre-wrap;"></div>
<button id="copyDiagBtn" style="display:none;background:#555555;">Copy Diagnostics</button>

<audio id="remoteAudio" autoplay playsinline></audio>
<button id="enableAudioBtn" style="display:none;background:#2ecc71;">Tap to Enable Audio</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
const PASSWORD = "why";
const ROOM_ID = "why-shared-room-fixed";

const statusEl = document.getElementById('status');
const passSection = document.getElementById('passSection');
const callControls = document.getElementById('callControls');
const passInput = document.getElementById('passInput');
const enterBtn = document.getElementById('enterBtn');
const hangupBtn = document.getElementById('hangupBtn');
const muteBtn = document.getElementById('muteBtn');
const retryBtn = document.getElementById('retryBtn');
const remoteAudio = document.getElementById('remoteAudio');
const enableAudioBtn = document.getElementById('enableAudioBtn');
const diagEl = document.getElementById('diag');
const copyDiagBtn = document.getElementById('copyDiagBtn');
let diagLines = [];

function log(msg) {
  diagLines.push(msg);
  diagEl.textContent = diagLines.join('\n');
  copyDiagBtn.style.display = 'inline-block';
  console.log(msg);
}

copyDiagBtn.addEventListener('click', () => {
  const text = diagLines.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      copyDiagBtn.textContent = "Copied!";
      setTimeout(() => copyDiagBtn.textContent = "Copy Diagnostics", 1500);
    });
  } else {
    diagEl.focus();
  }
});

enableAudioBtn.addEventListener('click', () => {
  remoteAudio.play().then(() => {
    enableAudioBtn.style.display = 'none';
  }).catch(() => {
    statusEl.textContent = "Still couldn't play audio. Try again.";
  });
});

let peer;
let localStream;
let currentCall;
let muted = false;

const XIRSYS_IDENT = "pokemore";
const XIRSYS_SECRET = "1ad741e2-7a81-11f1-9963-0242ac150002";
const XIRSYS_CHANNEL = "channel1adca0d8";

async function getIceServers() {
  try {
    const resp = await fetch("https://global.xirsys.net/_turn/" + XIRSYS_CHANNEL, {
      method: "PUT",
      headers: {
        "Authorization": "Basic " + btoa(XIRSYS_IDENT + ":" + XIRSYS_SECRET),
        "Content-Type": "application/json"
      }
    });
    const data = await resp.json();
    if (data.s === "ok" && data.v && data.v.iceServers) {
      log("Xirsys credentials fetched OK");
      return [data.v.iceServers];
    } else {
      log("Xirsys response unexpected: " + JSON.stringify(data));
      return [{ urls: 'stun:stun.l.google.com:19302' }];
    }
  } catch (e) {
    log("Xirsys fetch FAILED: " + e.message);
    return [{ urls: 'stun:stun.l.google.com:19302' }];
  }
}

enterBtn.addEventListener('click', async () => {
  if (passInput.value.trim().toLowerCase() !== PASSWORD) {
    statusEl.textContent = "Wrong password.";
    return;
  }
  passSection.style.display = 'none';
  statusEl.textContent = "Requesting mic...";
  log("Tapped Enter. Requesting mic...");
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log("Mic granted. Tracks: " + localStream.getAudioTracks().length);
  } catch (e) {
    statusEl.textContent = "Mic permission denied.";
    log("Mic FAILED: " + e.name + " - " + e.message);
    return;
  }
  connect();
});

retryBtn.addEventListener('click', connect);

async function connect() {
  statusEl.textContent = "Connecting to server...";
  retryBtn.style.display = 'none';

  if (peer) {
    try { peer.destroy(); } catch (e) {}
  }

  // Try to become the host of the fixed room first
  const iceServers = await getIceServers();
  log("Using " + iceServers.length + " ICE servers from Xirsys");
  peer = new Peer(ROOM_ID, {
    debug: 1,
    config: {
      iceServers: iceServers,
      iceTransportPolicy: 'relay'
    }
  });

  peer.on('open', () => {
    statusEl.textContent = "Waiting for someone else to join...";
    log("Peer server connected (as host). Waiting for other side...");
  });

  peer.on('call', (call) => {
    statusEl.textContent = "Connecting...";
    log("Incoming call received. Answering...");
    call.answer(localStream);
    setupCall(call);
  });

  peer.on('error', (err) => {
    log("Peer error: " + err.type);
    if (err.type === 'unavailable-id') {
      // Someone is already hosting, so call them instead
      joinAsCaller();
    } else {
      statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
      retryBtn.style.display = 'inline-block';
    }
  });

  peer.on('disconnected', () => {
    statusEl.textContent = "Disconnected. Tap Retry.";
    retryBtn.style.display = 'inline-block';
  });
}

async function joinAsCaller() {
  statusEl.textContent = "Joining call...";
  log("Room taken. Joining as caller instead...");
  peer.destroy();
  const iceServers2 = await getIceServers();
  log("Using " + iceServers2.length + " ICE servers from Xirsys");
  peer = new Peer({
    debug: 1,
    config: {
      iceServers: iceServers2,
      iceTransportPolicy: 'relay'
    }
  });

  peer.on('open', () => {
    const call = peer.call(ROOM_ID, localStream);
    setupCall(call);
  });

  peer.on('error', (err) => {
    statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
    retryBtn.style.display = 'inline-block';
  });
}

function setupCall(call) {
  currentCall = call;
  callControls.style.display = 'block';
  hangupBtn.style.display = 'inline-block';
  muteBtn.style.display = 'inline-block';

  const pc = call.peerConnection;
  if (pc) {
    pc.oniceconnectionstatechange = () => {
      log("ICE state: " + pc.iceConnectionState);
    };
    pc.onconnectionstatechange = () => {
      log("Connection state: " + pc.connectionState);
    };
  }

  call.on('stream', (remoteStream) => {
    const tracks = remoteStream.getAudioTracks();
    log("Got remote stream. Audio tracks: " + tracks.length + (tracks[0] ? (" | enabled: " + tracks[0].enabled + " | muted: " + tracks[0].muted) : ""));
    remoteAudio.srcObject = remoteStream;
    statusEl.textContent = "Connected — you're live!";
    const playPromise = remoteAudio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        log(diagEl.textContent + " | audio.play() succeeded");
      }).catch((err) => {
        log(diagEl.textContent + " | audio.play() BLOCKED: " + err.name);
        enableAudioBtn.style.display = 'inline-block';
      });
    }
  });

  call.on('close', endCallUI);
  call.on('error', endCallUI);
}

hangupBtn.addEventListener('click', () => {
  if (currentCall) currentCall.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peer) peer.destroy();
  endCallUI();
});

function endCallUI() {
  statusEl.textContent = "Call ended.";
  passSection.style.display = 'block';
  callControls.style.display = 'none';
  hangupBtn.style.display = 'none';
  muteBtn.style.display = 'none';
  muteBtn.classList.remove('muted');
  muteBtn.textContent = "Mute";
  muted = false;
  passInput.value = '';
}

muteBtn.addEventListener('click', () => {
  if (!localStream) return;
  muted = !muted;
  localStream.getAudioTracks().forEach(track => track.enabled = !muted);
  muteBtn.classList.toggle('muted', muted);
  muteBtn.textContent = muted ? "Unmute" : "Mute";
});
</script>

</body>
</html>
