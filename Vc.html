<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Call</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    color: #eeeeee;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-weight: normal;
    font-size: 20px;
    margin: 0 0 20px 0;
  }
  #status {
    color: #aaaaaa;
    margin-bottom: 20px;
    min-height: 20px;
    font-size: 14px;
  }
  input {
    padding: 14px;
    font-size: 22px;
    letter-spacing: 4px;
    border-radius: 8px;
    border: 1px solid #444444;
    background: #1a1a1a;
    color: #eeeeee;
    width: 160px;
    text-align: center;
    margin-bottom: 15px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  button {
    padding: 12px 22px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
    color: #ffffff;
  }
  #joinBtn { background: #3498db; }
  #hangupBtn { background: #e74c3c; display: none; }
  #muteBtn { background: #333333; border: 1px solid #555555; display: none; color: #eeeeee; }
  #muteBtn.muted { background: #555555; }
  #callControls { margin-top: 20px; }
  #retryBtn { background: #f39c12; display: none; }
  p.hint { color: #888888; font-size: 13px; margin: 0 0 15px 0; }
</style>
</head>
<body>

<h1>Voice Call</h1>
<div id="status">Loading...</div>
<button id="retryBtn">Retry Connection</button>

<div id="joinSection">
  <p class="hint">Both people enter the same 4-digit room code</p>
  <input id="roomCode" placeholder="0000" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
  <button id="joinBtn">Join Room</button>
</div>

<div id="callControls">
  <button id="hangupBtn">Hang Up</button>
  <button id="muteBtn">Mute</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
const statusEl = document.getElementById('status');
const roomCodeInput = document.getElementById('roomCode');
const joinBtn = document.getElementById('joinBtn');
const hangupBtn = document.getElementById('hangupBtn');
const muteBtn = document.getElementById('muteBtn');
const retryBtn = document.getElementById('retryBtn');
const joinSection = document.getElementById('joinSection');
const remoteAudio = document.getElementById('remoteAudio');

let peer;
let localStream;
let currentCall;
let muted = false;
let connectTimeout;
let myRoomCode = null;

function startPeer() {
  statusEl.textContent = "Connecting to server...";
  retryBtn.style.display = 'none';

  if (typeof Peer === 'undefined') {
    statusEl.textContent = "Failed to load call library. Check your internet connection and reload the page.";
    retryBtn.style.display = 'inline-block';
    return;
  }

  if (peer) {
    try { peer.destroy(); } catch (e) {}
  }

  peer = new Peer({
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  connectTimeout = setTimeout(() => {
    statusEl.textContent = "Taking a while to connect. Server may be busy.";
    retryBtn.style.display = 'inline-block';
  }, 10000);

  peer.on('open', () => {
    clearTimeout(connectTimeout);
    statusEl.textContent = "Ready. Enter a 4-digit room code.";
    retryBtn.style.display = 'none';
  });

  peer.on('error', (err) => {
    clearTimeout(connectTimeout);
    if (err.type === 'unavailable-id') {
      // Someone already claimed this room code as host, so become the joiner instead
      joinAsCaller(myRoomCode);
    } else if (err.type === 'peer-unavailable') {
      statusEl.textContent = "No one found with that code yet. Waiting...";
      claimRoom(myRoomCode);
    } else {
      statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
      retryBtn.style.display = 'inline-block';
    }
  });

  peer.on('disconnected', () => {
    statusEl.textContent = "Disconnected from server. Tap Retry.";
    retryBtn.style.display = 'inline-block';
  });

  peer.on('call', async (call) => {
    statusEl.textContent = "Connecting mic...";
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      statusEl.textContent = "Mic permission denied.";
      return;
    }
    call.answer(localStream);
    setupCall(call);
  });
}

retryBtn.addEventListener('click', startPeer);

roomCodeInput.addEventListener('input', () => {
  roomCodeInput.value = roomCodeInput.value.replace(/[^0-9]/g, '').slice(0, 4);
});

joinBtn.addEventListener('click', async () => {
  const code = roomCodeInput.value.trim();
  if (code.length !== 4) {
    statusEl.textContent = "Enter a 4-digit code first.";
    return;
  }
  myRoomCode = code;
  statusEl.textContent = "Requesting mic...";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    statusEl.textContent = "Mic permission denied.";
    return;
  }
  joinSection.style.display = 'none';
  claimRoom(code);
});

function claimRoom(code) {
  // Try to become the "host" of this room code first
  statusEl.textContent = "Joining room " + code + "...";
  peer.destroy();
  peer = new Peer('room-' + code, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', () => {
    statusEl.textContent = "Waiting for the other person to join room " + code + "...";
  });

  peer.on('call', async (call) => {
    statusEl.textContent = "Connecting...";
    call.answer(localStream);
    setupCall(call);
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      // Someone is already hosting this code, so call them instead
      joinAsCaller(code);
    } else {
      statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
      retryBtn.style.display = 'inline-block';
    }
  });
}

function joinAsCaller(code) {
  statusEl.textContent = "Connecting to room " + code + "...";
  peer.destroy();
  peer = new Peer({
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', () => {
    const call = peer.call('room-' + code, localStream);
    setupCall(call);
  });

  peer.on('error', (err) => {
    statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
    retryBtn.style.display = 'inline-block';
  });
}

function setupCall(call) {
  currentCall = call;
  hangupBtn.style.display = 'inline-block';
  muteBtn.style.display = 'inline-block';

  call.on('stream', (remoteStream) => {
    remoteAudio.srcObject = remoteStream;
    statusEl.textContent = "Connected — you're live!";
  });

  call.on('close', endCallUI);
  call.on('error', endCallUI);
}

hangupBtn.addEventListener('click', () => {
  if (currentCall) currentCall.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peer) peer.destroy();
  endCallUI();
});

function endCallUI() {
  statusEl.textContent = "Call ended.";
  joinSection.style.display = 'block';
  hangupBtn.style.display = 'none';
  muteBtn.style.display = 'none';
  muteBtn.classList.remove('muted');
  muteBtn.textContent = "Mute";
  muted = false;
  roomCodeInput.value = '';
  startPeer();
}

muteBtn.addEventListener('click', () => {
  if (!localStream) return;
  muted = !muted;
  localStream.getAudioTracks().forEach(track => track.enabled = !muted);
  muteBtn.classList.toggle('muted', muted);
  muteBtn.textContent = muted ? "Unmute" : "Mute";
});

startPeer();
</script>

</body>
</html>
