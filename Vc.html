<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Call</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    color: #eeeeee;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 { font-weight: normal; font-size: 20px; margin: 10px 0 20px 0; }
  #status { color: #aaaaaa; margin-bottom: 15px; min-height: 20px; font-size: 14px; }
  input, textarea {
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #444444;
    background: #1a1a1a;
    color: #eeeeee;
    text-align: center;
    margin-bottom: 12px;
    width: 100%;
    max-width: 320px;
  }
  textarea { font-size: 12px; height: 80px; text-align: left; resize: none; }
  button {
    padding: 12px 22px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
    color: #ffffff;
    background: #3498db;
  }
  button.danger { background: #e74c3c; }
  button.secondary { background: #333333; border: 1px solid #555555; }
  button.secondary.muted { background: #e67e22; }
  button.orange { background: #f39c12; }
  .step { display:none; width:100%; max-width:340px; }
  .step p { margin: 0 0 8px 0; font-size: 13px; color: #999999; }
  #diag {
    font-size: 13px; color: #2ecc71; margin-top: 15px; max-width: 340px;
    border: 1px solid #333333; border-radius: 8px; padding: 10px;
    text-align: left; white-space: pre-wrap; width: 100%;
  }
</style>
</head>
<body>

<h1>Voice Call</h1>
<div id="status">Enter password to join</div>

<div id="passSection">
  <input id="passInput" type="password" placeholder="Password" autocomplete="off">
  <br>
  <button id="enterBtn">Enter</button>
</div>

<div id="chooseSection" class="step">
  <button id="startCallBtn">Start Call</button>
  <button id="joinCallBtn" class="secondary">Join Call</button>
</div>

<div id="step1" class="step">
  <p>1. Copy this code and send it to your friend:</p>
  <textarea id="offerCode" readonly></textarea>
  <button id="copyOfferBtn">Copy Code</button>
</div>

<div id="step2" class="step">
  <p>2. Paste the code your friend sends back here:</p>
  <textarea id="answerInput" placeholder="Paste their reply code here"></textarea>
  <button id="connectBtn">Connect</button>
</div>

<div id="joinStep1" class="step">
  <p>1. Paste the code your friend sent you:</p>
  <textarea id="offerInput" placeholder="Paste their code here"></textarea>
  <button id="generateAnswerBtn">Generate Reply Code</button>
</div>

<div id="joinStep2" class="step">
  <p>2. Copy this reply code and send it back to your friend:</p>
  <textarea id="answerCode" readonly></textarea>
  <button id="copyAnswerBtn">Copy Reply Code</button>
</div>

<div id="callControls" style="display:none;">
  <button id="hangupBtn" class="danger">Hang Up</button>
  <button id="muteBtn" class="secondary">Mute</button>
</div>

<button id="enableAudioBtn" style="display:none;background:#2ecc71;">Tap to Enable Audio</button>

<div id="diag"></div>
<button id="copyDiagBtn" style="display:none;" class="secondary">Copy Diagnostics</button>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
const PASSWORD = "why";

const XIRSYS_IDENT = "pokemore";
const XIRSYS_SECRET = "1ad741e2-7a81-11f1-9963-0242ac150002";
const XIRSYS_CHANNEL = "channel1adca0d8";

const statusEl = document.getElementById('status');
const passSection = document.getElementById('passSection');
const passInput = document.getElementById('passInput');
const enterBtn = document.getElementById('enterBtn');

const chooseSection = document.getElementById('chooseSection');
const startCallBtn = document.getElementById('startCallBtn');
const joinCallBtn = document.getElementById('joinCallBtn');

const step1 = document.getElementById('step1');
const offerCode = document.getElementById('offerCode');
const copyOfferBtn = document.getElementById('copyOfferBtn');

const step2 = document.getElementById('step2');
const answerInput = document.getElementById('answerInput');
const connectBtn = document.getElementById('connectBtn');

const joinStep1 = document.getElementById('joinStep1');
const offerInput = document.getElementById('offerInput');
const generateAnswerBtn = document.getElementById('generateAnswerBtn');

const joinStep2 = document.getElementById('joinStep2');
const answerCode = document.getElementById('answerCode');
const copyAnswerBtn = document.getElementById('copyAnswerBtn');

const callControls = document.getElementById('callControls');
const hangupBtn = document.getElementById('hangupBtn');
const muteBtn = document.getElementById('muteBtn');
const enableAudioBtn = document.getElementById('enableAudioBtn');
const remoteAudio = document.getElementById('remoteAudio');

const diagEl = document.getElementById('diag');
const copyDiagBtn = document.getElementById('copyDiagBtn');
let diagLines = [];

function log(msg) {
  diagLines.push(msg);
  diagEl.textContent = diagLines.join('\n');
  copyDiagBtn.style.display = 'inline-block';
  console.log(msg);
}

copyDiagBtn.addEventListener('click', () => {
  const text = diagLines.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      copyDiagBtn.textContent = "Copied!";
      setTimeout(() => copyDiagBtn.textContent = "Copy Diagnostics", 1500);
    });
  }
});

let pc;
let localStream;
let muted = false;

function encode(obj) { return btoa(JSON.stringify(obj)); }
function decode(str) { return JSON.parse(atob(str.trim())); }

async function getIceServers() {
  try {
    const resp = await fetch("https://global.xirsys.net/_turn/" + XIRSYS_CHANNEL, {
      method: "PUT",
      headers: {
        "Authorization": "Basic " + btoa(XIRSYS_IDENT + ":" + XIRSYS_SECRET),
        "Content-Type": "application/json"
      }
    });
    const data = await resp.json();
    if (data.s === "ok" && data.v && data.v.iceServers) {
      log("Xirsys TURN credentials fetched OK");
      return [data.v.iceServers];
    }
    log("Xirsys response unexpected, falling back to STUN only");
  } catch (e) {
    log("Xirsys fetch failed (" + e.message + "), falling back to STUN only");
  }
  return [{ urls: 'stun:stun.l.google.com:19302' }];
}

async function getMic() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log("Mic granted. Tracks: " + localStream.getAudioTracks().length);
    return true;
  } catch (e) {
    statusEl.textContent = "Mic permission denied.";
    log("Mic FAILED: " + e.name);
    return false;
  }
}

async function createPeerConnection() {
  const iceServers = await getIceServers();
  pc = new RTCPeerConnection({ iceServers: iceServers });

  pc.oniceconnectionstatechange = () => log("ICE state: " + pc.iceConnectionState);
  pc.onconnectionstatechange = () => log("Connection state: " + pc.connectionState);

  pc.ontrack = (e) => {
    const tracks = e.streams[0].getAudioTracks();
    log("Got remote stream. Audio tracks: " + tracks.length);
    remoteAudio.srcObject = e.streams[0];
    statusEl.textContent = "Connected — you're live!";
    callControls.style.display = 'block';
    const p = remoteAudio.play();
    if (p !== undefined) {
      p.then(() => log("audio.play() succeeded"))
       .catch((err) => { log("audio.play() BLOCKED: " + err.name); enableAudioBtn.style.display = 'inline-block'; });
    }
  };

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

function waitForIceGathering() {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') resolve();
    });
  });
}

enterBtn.addEventListener('click', () => {
  if (passInput.value.trim().toLowerCase() !== PASSWORD) {
    statusEl.textContent = "Wrong password.";
    return;
  }
  passSection.style.display = 'none';
  chooseSection.style.display = 'block';
  statusEl.textContent = "Start a call or join one.";
});

startCallBtn.addEventListener('click', async () => {
  statusEl.textContent = "Requesting mic...";
  if (!(await getMic())) return;
  chooseSection.style.display = 'none';
  statusEl.textContent = "Creating call code...";

  await createPeerConnection();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIceGathering();

  offerCode.value = encode(pc.localDescription);
  step1.style.display = 'block';
  step2.style.display = 'block';
  statusEl.textContent = "Send the code below to your friend.";
});

copyOfferBtn.addEventListener('click', () => {
  offerCode.select();
  document.execCommand('copy');
  copyOfferBtn.textContent = "Copied!";
  setTimeout(() => copyOfferBtn.textContent = "Copy Code", 1500);
});

connectBtn.addEventListener('click', async () => {
  try {
    const answer = decode(answerInput.value);
    await pc.setRemoteDescription(answer);
    statusEl.textContent = "Connecting...";
    log("Remote answer applied. Waiting for connection...");
  } catch (e) {
    statusEl.textContent = "Invalid code. Ask your friend to resend it.";
    log("Failed to apply answer: " + e.message);
  }
});

joinCallBtn.addEventListener('click', async () => {
  statusEl.textContent = "Requesting mic...";
  if (!(await getMic())) return;
  chooseSection.style.display = 'none';
  joinStep1.style.display = 'block';
  statusEl.textContent = "Paste the code your friend sent you.";
});

generateAnswerBtn.addEventListener('click', async () => {
  try {
    const offer = decode(offerInput.value);
    await createPeerConnection();
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForIceGathering();

    answerCode.value = encode(pc.localDescription);
    joinStep2.style.display = 'block';
    statusEl.textContent = "Send this reply code back to your friend.";
  } catch (e) {
    statusEl.textContent = "Invalid code. Ask your friend to resend it.";
    log("Failed to process offer: " + e.message);
  }
});

copyAnswerBtn.addEventListener('click', () => {
  answerCode.select();
  document.execCommand('copy');
  copyAnswerBtn.textContent = "Copied!";
  setTimeout(() => copyAnswerBtn.textContent = "Copy Reply Code", 1500);
});

enableAudioBtn.addEventListener('click', () => {
  remoteAudio.play().then(() => enableAudioBtn.style.display = 'none');
});

hangupBtn.addEventListener('click', () => {
  if (pc) pc.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  location.reload();
});

muteBtn.addEventListener('click', () => {
  if (!localStream) return;
  muted = !muted;
  localStream.getAudioTracks().forEach(track => track.enabled = !muted);
  muteBtn.classList.toggle('muted', muted);
  muteBtn.textContent = muted ? "Unmute" : "Mute";
});
</script>

</body>
</html>
