<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Call</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    color: #eeeeee;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-weight: normal;
    font-size: 20px;
    margin: 0 0 20px 0;
  }
  #status {
    color: #aaaaaa;
    margin-bottom: 20px;
    min-height: 20px;
    font-size: 14px;
  }
  input {
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #444444;
    background: #1a1a1a;
    color: #eeeeee;
    width: 200px;
    text-align: center;
    margin-bottom: 15px;
  }
  button {
    padding: 12px 22px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
    color: #ffffff;
  }
  #enterBtn { background: #3498db; }
  #hangupBtn { background: #e74c3c; display: none; }
  #muteBtn { background: #333333; border: 1px solid #555555; display: none; color: #eeeeee; }
  #muteBtn.muted { background: #e67e22; }
  #retryBtn { background: #f39c12; display: none; }
  #callControls { margin-top: 20px; }
</style>
</head>
<body>

<h1>Voice Call</h1>
<div id="status">Enter password to join</div>

<div id="passSection">
  <input id="passInput" type="password" placeholder="Password" autocomplete="off">
  <br>
  <button id="enterBtn">Enter</button>
</div>

<div id="callControls">
  <button id="hangupBtn">Hang Up</button>
  <button id="muteBtn">Mute</button>
</div>

<button id="retryBtn">Retry Connection</button>

<audio id="remoteAudio" autoplay></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
const PASSWORD = "why";
const ROOM_ID = "why-shared-room-fixed";

const statusEl = document.getElementById('status');
const passSection = document.getElementById('passSection');
const passInput = document.getElementById('passInput');
const enterBtn = document.getElementById('enterBtn');
const hangupBtn = document.getElementById('hangupBtn');
const muteBtn = document.getElementById('muteBtn');
const retryBtn = document.getElementById('retryBtn');
const remoteAudio = document.getElementById('remoteAudio');

let peer;
let localStream;
let currentCall;
let muted = false;

enterBtn.addEventListener('click', async () => {
  if (passInput.value.trim().toLowerCase() !== PASSWORD) {
    statusEl.textContent = "Wrong password.";
    return;
  }
  passSection.style.display = 'none';
  statusEl.textContent = "Requesting mic...";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    statusEl.textContent = "Mic permission denied.";
    return;
  }
  connect();
});

retryBtn.addEventListener('click', connect);

function connect() {
  statusEl.textContent = "Connecting to server...";
  retryBtn.style.display = 'none';

  if (peer) {
    try { peer.destroy(); } catch (e) {}
  }

  // Try to become the host of the fixed room first
  peer = new Peer(ROOM_ID, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', () => {
    statusEl.textContent = "Waiting for someone else to join...";
  });

  peer.on('call', (call) => {
    statusEl.textContent = "Connecting...";
    call.answer(localStream);
    setupCall(call);
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      // Someone is already hosting, so call them instead
      joinAsCaller();
    } else {
      statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
      retryBtn.style.display = 'inline-block';
    }
  });

  peer.on('disconnected', () => {
    statusEl.textContent = "Disconnected. Tap Retry.";
    retryBtn.style.display = 'inline-block';
  });
}

function joinAsCaller() {
  statusEl.textContent = "Joining call...";
  peer.destroy();
  peer = new Peer({
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', () => {
    const call = peer.call(ROOM_ID, localStream);
    setupCall(call);
  });

  peer.on('error', (err) => {
    statusEl.textContent = "Connection error (" + err.type + "). Tap Retry.";
    retryBtn.style.display = 'inline-block';
  });
}

function setupCall(call) {
  currentCall = call;
  hangupBtn.style.display = 'inline-block';
  muteBtn.style.display = 'inline-block';

  call.on('stream', (remoteStream) => {
    remoteAudio.srcObject = remoteStream;
    statusEl.textContent = "Connected — you're live!";
  });

  call.on('close', endCallUI);
  call.on('error', endCallUI);
}

hangupBtn.addEventListener('click', () => {
  if (currentCall) currentCall.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peer) peer.destroy();
  endCallUI();
});

function endCallUI() {
  statusEl.textContent = "Call ended.";
  passSection.style.display = 'block';
  hangupBtn.style.display = 'none';
  muteBtn.style.display = 'none';
  muteBtn.classList.remove('muted');
  muteBtn.textContent = "Mute";
  muted = false;
  passInput.value = '';
}

muteBtn.addEventListener('click', () => {
  if (!localStream) return;
  muted = !muted;
  localStream.getAudioTracks().forEach(track => track.enabled = !muted);
  muteBtn.classList.toggle('muted', muted);
  muteBtn.textContent = muted ? "Unmute" : "Mute";
});
</script>

</body>
</html>
